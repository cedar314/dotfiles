# Loaded by ~/.tmux.conf; XDG environment is inherited by the tmux server.
run-shell 'tmux set-environment -g TMUX_CONFIG_HOME "${XDG_CONFIG_HOME:-$HOME/.config}/tmux"'
run-shell 'tmux set-environment -g TMUX_DATA_HOME "${XDG_DATA_HOME:-$HOME/.local/share}/tmux"'
# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vim-style copy mode
setw -g mode-keys vi

# Start selection with v
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy selection with y
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Better pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Alt + arrow keys
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# Split panes
bind | split-window -h
bind - split-window -v

# Reload config
bind r source-file "#{TMUX_CONFIG_HOME}/tmux.conf" \; display-message "tmux config reloaded"

# History
set -g history-limit 10000

# Mouse support
set -g mouse on

# Extend display message
set -g display-time 2000

# Tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (keep this at the end of the config)
# Both plugins are provisioned explicitly by setup, not downloaded by tmux.
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{TMUX_DATA_HOME}/plugins/'
if-shell 'test -f "$TMUX_DATA_HOME/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux"' 'run-shell "\"$TMUX_DATA_HOME/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux\""'
if-shell 'test -f "$TMUX_DATA_HOME/plugins/tpm/tpm"' 'run-shell "\"$TMUX_DATA_HOME/plugins/tpm/tpm\""' 

# Preserve modified keys so Shift+Enter inserts a newline in Codex.
set -s extended-keys on
set -s extended-keys-format csi-u
